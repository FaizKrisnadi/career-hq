    <circle cx="1225" cy="228" r="122" fill="#ffffff" stroke="#ccd6e3" stroke-width="1.4"/>
    <circle cx="1225" cy="228" r="81" fill="none" stroke="#ccd6e3"/>
    <circle cx="1225" cy="228" r="40" fill="none" stroke="#ccd6e3"/>
    <line x1="1103" y1="228" x2="1347" y2="228" stroke="#ccd6e3" stroke-width="0.8"/>
    <line x1="1225" y1="106" x2="1225" y2="350" stroke="#ccd6e3" stroke-width="0.8"/>
    <path d="M 1225 228 L 1225 106 A 122 122 0 0 1 1330.7 167 Z" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate" from="0 1225 228" to="360 1225 228" dur="7s" repeatCount="indefinite"/>
    </path>
    <circle cx="1160" cy="190" r="3.5" fill="#0a8f5b"><animate attributeName="opacity" values="1;0.15;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1290" cy="262" r="3.5" fill="#0a8f5b"><animate attributeName="opacity" values="1;0.15;1" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1248" cy="152" r="3.5" fill="#0a8f5b"><animate attributeName="opacity" values="1;0.15;1" dur="2.6s" begin="1.7s" repeatCount="indefinite"/></circle>
    <text x="1225" y="372" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="2" fill="#9aa7b5">SWEEP 360° · 7S</text>
