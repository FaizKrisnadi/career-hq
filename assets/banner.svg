    <line x1="1050" y1="72" x2="994" y2="352"/><line x1="1200" y1="72" x2="1200" y2="352"/>
    <line x1="1350" y1="72" x2="1350" y2="352"/>
    <line x1="0" y1="120" x2="1500" y2="120"/><line x1="0" y1="210" x2="1500" y2="210"/>
