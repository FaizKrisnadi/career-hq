  <line x1="0" y1="358" x2="1500" y2="358" stroke="#2a3441"/>
  <circle cx="72" cy="394" r="4" fill="#34d17c"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></circle>
  <text x="86" y="398" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#9fb0c2">WORKERS + D1 + R2 · CLOUDFLARE FREE TIER</text>
  <text x="750" y="398" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#9fb0c2">VINEXT — NEXT.JS API SURFACE ON VITE</text>
  <text x="1430" y="398" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#9fb0c2">PAID APIs · 0</text>
