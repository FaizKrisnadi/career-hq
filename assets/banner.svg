    <rect x="544" y="150" width="172" height="44" rx="4" fill="#f2f5f9" stroke="#d4dce6"/>
    <rect x="556" y="162" width="116" height="8" rx="3" fill="#dbe3ec"/><rect x="556" y="176" width="72" height="8" rx="3" fill="#e4eaf1"/>
    <text x="544" y="292" font-size="10.5" letter-spacing="1" fill="#9aa7b5">WRITEBACK · MIRROR-ONLY</text>
  </g>

