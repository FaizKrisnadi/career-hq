    <line x1="84" y1="138" x2="256" y2="138" stroke="#e4e9f0"/>
    <rect x="84" y="150" width="172" height="44" rx="4" fill="#f2f5f9" stroke="#d4dce6"/>
    <rect x="96" y="162" width="110" height="8" rx="3" fill="#dbe3ec"/><rect x="96" y="176" width="70" height="8" rx="3" fill="#e4eaf1"/>
