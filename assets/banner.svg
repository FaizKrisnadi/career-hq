    <rect x="314" y="150" width="172" height="44" rx="4" fill="#f2f5f9" stroke="#d4dce6"/>
    <rect x="326" y="162" width="104" height="8" rx="3" fill="#dbe3ec"/><rect x="326" y="176" width="66" height="8" rx="3" fill="#e4eaf1"/>
    <rect x="314" y="206" width="172" height="44" rx="4" fill="#fffaf0" stroke="#f0b429" stroke-width="1.6"/>
