    <line x1="880" y1="254" x2="994" y2="254" stroke="#c3cdd9" stroke-dasharray="2 4"/>
    <rect x="1000" y="240" width="86" height="20" rx="3" fill="#eef7f1" stroke="#bfe3d2"/>
